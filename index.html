<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Hälsning 🎃</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #1a0530 0%, #0d0214 70%, #050108 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    overflow-x: hidden;
    color: #ffb366;
    position: relative;
  }

  /* ===== 星空背景 ===== */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: starTwinkle 3s ease-in-out infinite;
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* ===== 月亮 ===== */
  .moon {
    position: absolute;
    top: 8%;
    right: 10%;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e0, #f0e0b0);
    box-shadow: 0 0 40px rgba(255, 248, 224, 0.4), 0 0 80px rgba(255, 248, 224, 0.2);
    opacity: 0;
    animation: moonFadeIn 2s ease-out forwards;
    z-index: 2;
  }
  @keyframes moonFadeIn {
    to { opacity: 1; }
  }

  /* ===== 主容器 ===== */
  .container {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  /* ===== Trick or Treat 大标题 ===== */
  .main-title {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: bold;
    color: #ff7722;
    text-shadow: 0 0 20px #ff6600, 0 0 40px #ff4400, 0 0 60px rgba(255, 100, 0, 0.5);
    margin-bottom: 30px;
    opacity: 0;
    letter-spacing: 0.05em;
  }
  .main-title.show {
    animation: titlePop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
               titleGlow 2.5s ease-in-out infinite 1.5s;
  }
  @keyframes titlePop {
    0% { opacity: 0; transform: scale(0.3) rotate(-5deg); }
    60% { opacity: 1; transform: scale(1.1) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 20px #ff6600, 0 0 40px #ff4400, 0 0 60px rgba(255, 100, 0, 0.5); }
    50% { text-shadow: 0 0 30px #ff8833, 0 0 60px #ff6600, 0 0 90px rgba(255, 120, 0, 0.7); }
  }

  /* ===== 南瓜灯 SVG ===== */
  .pumpkin {
    width: clamp(120px, 20vw, 180px);
    height: auto;
    margin: 10px 0 25px;
    opacity: 0;
    filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6));
  }
  .pumpkin.show {
    animation: pumpkinRise 1.5s ease-out forwards,
               pumpkinFlicker 2s ease-in-out infinite 2s;
  }
  @keyframes pumpkinRise {
    0% { opacity: 0; transform: translateY(40px) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pumpkinFlicker {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.6)); }
    50% { filter: drop-shadow(0 0 25px rgba(255, 160, 0, 0.9)); }
  }

  /* ===== 幽灵 ===== */
  .ghost {
    position: absolute;
    font-size: 3rem;
    opacity: 0;
    z-index: 5;
    filter: drop-shadow(0 0 10px rgba(200, 200, 255, 0.5));
  }
  .ghost.show {
    animation: ghostFloatIn 2s ease-out forwards,
               ghostBob 3s ease-in-out infinite 2s;
  }
  .ghost-1 { top: 15%; left: 8%; }
  .ghost-2 { top: 20%; right: 10%; font-size: 2.2rem; }
  .ghost-3 { bottom: 18%; left: 12%; font-size: 2.5rem; }
  .ghost-4 { bottom: 15%; right: 8%; font-size: 2rem; }

  @keyframes ghostFloatIn {
    0% { opacity: 0; transform: translateY(-30px) scale(0.5); }
    100% { opacity: 0.8; transform: translateY(0) scale(1); }
  }
  @keyframes ghostBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-15px) rotate(3deg); }
  }

  /* ===== 祝福文字 ===== */
  .blessing {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    color: #ffd9a0;
    margin: 8px 0;
    opacity: 0;
    line-height: 1.6;
  }
  .blessing.show {
    animation: fadeUp 1s ease-out forwards;
  }
  .blessing:nth-child(2).show { animation-delay: 0.2s; }
  .blessing:nth-child(3).show { animation-delay: 0.4s; }
  .blessing:nth-child(4).show { animation-delay: 0.6s; }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ===== 底部签名 ===== */
  .signature {
    margin-top: 35px;
    font-size: 0.9rem;
    color: #996644;
    font-style: italic;
    opacity: 0;
  }
  .signature.show {
    animation: fadeIn 1.5s ease-out forwards;
  }
  @keyframes fadeIn {
    to { opacity: 0.8; }
  }

  /* ===== 漂浮粒子（持续） ===== */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ff9944;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% {
      opacity: 0;
      transform: translateY(100vh) scale(0.5);
    }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% {
      opacity: 0;
      transform: translateY(-10vh) translateX(30px) scale(1.2);
    }
  }

  /* ===== 开场黑屏遮罩 ===== */
  .intro-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: overlayFade 1.5s ease-out 0.5s forwards;
  }
  .intro-overlay .loading-text {
    color: #ff6600;
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes overlayFade {
    to { opacity: 0; visibility: hidden; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @media (max-width: 480px) {
    .ghost { font-size: 2rem; }
    .ghost-2, .ghost-3, .ghost-4 { font-size: 1.5rem; }
    .moon { width: 50px; height: 50px; }
  }

  /* ===== 减少动效模式：直接显示终态 ===== */
  @media (prefers-reduced-motion: reduce) {
    .intro-overlay { display: none !important; }
    .moon { opacity: 1; animation: none; }
    .main-title { opacity: 1; animation: none; }
    .pumpkin { opacity: 1; animation: none; }
    .ghost { opacity: 0.8; animation: ghostBob 3s ease-in-out infinite; }
    .blessing { opacity: 1; animation: none; }
    .signature { opacity: 0.8; animation: none; }
    .star { animation: starTwinkle 3s ease-in-out infinite; }
    .particle { animation: particleFloat 12s linear infinite; }
  }
</style>
</head>
<body>

<!-- 开场遮罩 -->
<div class="intro-overlay">
  <div class="loading-text">HALLOWEEN</div>
</div>

<!-- 星空 -->
<div class="stars" id="stars"></div>

<!-- 月亮 -->
<div class="moon"></div>

<!-- 漂浮粒子容器 -->
<div id="particles"></div>

<!-- 幽灵装饰 -->
<div class="ghost ghost-1">👻</div>
<div class="ghost ghost-2">👻</div>
<div class="ghost ghost-3">🎃</div>
<div class="ghost ghost-4">🕸️</div>

<!-- 主内容 -->
<div class="container">
  <h1 class="main-title" id="mainTitle">Trick or Treat!</h1>

  <!-- 南瓜灯 SVG -->
  <svg class="pumpkin" id="pumpkin" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
    <!-- 茎 -->
    <path d="M 95 25 Q 100 10 110 15 Q 105 25 105 30 Z" fill="#4a7c3a"/>
    <!-- 南瓜主体 -->
    <ellipse cx="100" cy="100" rx="80" ry="65" fill="#ff7722"/>
    <ellipse cx="70" cy="100" rx="35" ry="62" fill="#ee6611"/>
    <ellipse cx="130" cy="100" rx="35" ry="62" fill="#ee6611"/>
    <ellipse cx="100" cy="100" rx="55" ry="65" fill="#ff8833"/>
    <!-- 眼睛 -->
    <polygon points="70,80 85,65 90,85" fill="#1a0500"/>
    <polygon points="130,80 115,65 110,85" fill="#1a0500"/>
    <!-- 三角鼻子 -->
    <polygon points="100,95 93,110 107,110" fill="#1a0500"/>
    <!-- 锯齿嘴 -->
    <path d="M 60 125 L 75 115 L 85 128 L 100 118 L 115 128 L 125 115 L 140 125 L 135 140 L 65 140 Z" fill="#1a0500"/>
    <!-- 发光效果 -->
    <ellipse cx="77" cy="77" rx="8" ry="6" fill="#ffdd66" opacity="0.8"/>
    <ellipse cx="123" cy="77" rx="8" ry="6" fill="#ffdd66" opacity="0.8"/>
  </svg>

  <p class="blessing">Spöken, pumpor och godis väntar dig i kväll!</p>
  <p class="blessing">Ha en riktigt läskig och rolig Halloween — må dina drömmar vara sötare än ditt godis.</p>
  <p class="blessing">Njut av kvällen med vänner och familj, och låt ingen mörk rädsla följa dig hem.</p>

  <p class="signature">— Din Halloween-hälsning 🌙</p>
</div>

<script>
  // 生成星星
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 70 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (2 + Math.random() * 3) + 's';
    starsContainer.appendChild(star);
  }

  // 生成持续漂浮的粒子
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.background = Math.random() > 0.5 ? '#ff9944' : '#cc88ff';
    p.style.width = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    particlesContainer.appendChild(p);
  }

  // ===== 15 秒动画时间线 =====
  window.addEventListener('load', () => {
    // 0.5s 遮罩淡出（CSS 已设置）
    // 2s 南瓜升起
    setTimeout(() => {
      document.getElementById('pumpkin').classList.add('show');
    }, 2000);

    // 4s 主标题弹出
    setTimeout(() => {
      document.getElementById('mainTitle').classList.add('show');
    }, 4000);

    // 6s 幽灵飘入
    setTimeout(() => {
      document.querySelectorAll('.ghost').forEach(g => g.classList.add('show'));
    }, 6000);

    // 8s 祝福文字依次淡入
    setTimeout(() => {
      document.querySelectorAll('.blessing').forEach(b => b.classList.add('show'));
    }, 8000);

    // 11s 签名出现
    setTimeout(() => {
      document.querySelector('.signature').classList.add('show');
    }, 11000);

    // 约 12-15s 完成入场，之后所有循环动画持续运行
  });
</script>

</body>
</html>
